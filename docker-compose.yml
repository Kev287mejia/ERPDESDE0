services:
  db:
    image: postgres:16-alpine
    container_name: vector_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vector_erp_db}
      POSTGRES_USER: ${POSTGRES_USER:-vector_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vector_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vector_admin} -d ${POSTGRES_DB:-vector_erp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: vector_erp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vector_erp_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY:-vector-production-saas-hq-secret-key-2026-secure}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,web}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vector_admin}:${POSTGRES_PASSWORD:-vector_secure_password_2026}@db:5432/${POSTGRES_DB:-vector_erp_db}
      - REDIS_URL=redis://redis:6379/1
      - TIME_ZONE=America/Managua
      - LANGUAGE_CODE=es-ni
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 120"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
