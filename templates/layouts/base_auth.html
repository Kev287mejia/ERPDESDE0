<!DOCTYPE html>
<html lang="es" class="h-full bg-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="theme-color" content="#18181B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="{% url 'pwa_manifest' %}">
    <title>{% block title %}Acceso{% endblock %} | ERP</title>

    <!-- Tipografía: Inter (UI) & JetBrains Mono (Cifras/Datos) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                }
            }
        }
    </script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.body.addEventListener('htmx:configRequest', (event) => {
                const csrfMeta = document.querySelector('meta[name="csrf-token"]');
                if (csrfMeta) {
                    event.detail.headers['X-CSRFToken'] = csrfMeta.getAttribute('content');
                }
            });
        });
    </script>

    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            letter-spacing: -0.011em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #FFFFFF;
            color: #18181B;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; letter-spacing: -0.02em; }
        .tabular-nums { font-variant-numeric: tabular-nums; }
        [x-cloak] { display: none !important; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-white flex flex-col justify-center items-center px-4 py-12 text-zinc-900 antialiased selection:bg-zinc-900 selection:text-white">

    <!-- Notificaciones Flash Estilo Toast -->
    {% if messages %}
    <div class="w-full max-w-[360px] mb-4">
        {% for message in messages %}
        <div class="border border-zinc-200 bg-zinc-50 rounded-md p-3 text-xs flex items-center justify-between text-zinc-800">
            <div class="flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full {% if message.tags == 'error' %}bg-red-600{% elif message.tags == 'warning' %}bg-amber-500{% else %}bg-emerald-600{% endif %}"></span>
                <span class="font-sans text-xs">{{ message }}</span>
            </div>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Contenedor Principal Limpio -->
    <main class="w-full max-w-[360px]">
        {% block content %}{% endblock %}
    </main>

    <!-- Pie Discreto -->
    <footer class="mt-8 text-center text-xs text-zinc-400 font-sans">
        &copy; 2026 Eternal Labs
    </footer>

    {% block extra_scripts %}{% endblock %}

    <!-- Registro PWA Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('{% url "pwa_service_worker" %}')
                    .catch(() => {});
            });
        }
    </script>
</body>
</html>
